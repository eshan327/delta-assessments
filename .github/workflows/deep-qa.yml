name: Deep generator QA

on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run qa:deep
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generator-qa
          path: qa-report.json
